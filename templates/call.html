{% extends "base.html" %}
{% block title %}Call with @{{ partner }} — RSMedia{% endblock %}

{% block content %}
<div class="call-wrap">

  <p class="call-title">Call with <span>@{{ partner }}</span></p>
  <p class="call-status" id="status">Connecting…</p>

  <div class="videos">
    <div class="video-box">
      <video id="local-video"  autoplay muted  playsinline></video>
      <span class="video-label">You (@{{ me }})</span>
    </div>
    <div class="video-box">
      <video id="remote-video" autoplay playsinline></video>
      <span class="video-label">@{{ partner }}</span>
    </div>
  </div>

  <div class="call-controls">
    <button class="btn btn-ghost"    id="btn-mute"  onclick="toggleMute()">Mute</button>
    <button class="btn btn-ghost"    id="btn-video" onclick="toggleVideo()">Hide Camera</button>
    <button class="btn btn-danger"   onclick="endCall()">End Call</button>
  </div>

</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const ME      = "{{ me }}";
  const PARTNER = "{{ partner }}";
  const socket  = io();

  let localStream = null;
  let pc          = null;
  let muted       = false;
  let videoOff    = false;

  const ICE_SERVERS = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  };

  // ── 1. Get local media then join signaling room ──────────────────────────
  async function init() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia(
        { video: true, audio: true }
      );
      document.getElementById("local-video").srcObject = localStream;
      setStatus("Waiting for " + PARTNER + "…");
    } catch (err) {
      setStatus("Camera/mic access denied. Audio-only mode.");
      localStream = await navigator.mediaDevices.getUserMedia(
        { video: false, audio: true }
      ).catch(() => null);
    }
    socket.emit("join_call", { partner: PARTNER });
  }

  // ── 2. Peer joined → we are the caller, create offer ────────────────────
  socket.on("peer_joined", async () => {
    setStatus("Peer connected — starting call…");
    pc = createPC();
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit("webrtc_offer", { partner: PARTNER, sdp: pc.localDescription });
  });

  // ── 3. Callee receives offer → answer ───────────────────────────────────
  socket.on("webrtc_offer", async (data) => {
    setStatus("Incoming call from " + data.from + "…");
    pc = createPC();
    if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    socket.emit("webrtc_answer", { partner: PARTNER, sdp: pc.localDescription });
  });

  // ── 4. Caller receives answer ────────────────────────────────────────────
  socket.on("webrtc_answer", async (data) => {
    if (pc) await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
    setStatus("Call connected!");
  });

  // ── 5. ICE candidates ────────────────────────────────────────────────────
  socket.on("webrtc_ice", async (data) => {
    if (pc && data.candidate) {
      try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); }
      catch (e) { console.warn("ICE error", e); }
    }
  });

  // ── 6. Remote hung up ────────────────────────────────────────────────────
  socket.on("call_ended", () => {
    setStatus("Call ended by " + PARTNER + ".");
    cleanup();
    setTimeout(() => { window.location.href = "/chat/" + PARTNER; }, 2000);
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function createPC() {
    const peer = new RTCPeerConnection(ICE_SERVERS);

    peer.onicecandidate = (e) => {
      if (e.candidate)
        socket.emit("webrtc_ice", { partner: PARTNER, candidate: e.candidate });
    };

    peer.ontrack = (e) => {
      const rv = document.getElementById("remote-video");
      if (!rv.srcObject) rv.srcObject = e.streams[0];
      setStatus("Call connected!");
    };

    peer.onconnectionstatechange = () => {
      if (["disconnected","failed","closed"].includes(peer.connectionState)) {
        setStatus("Connection lost.");
        cleanup();
      }
    };

    return peer;
  }

  function toggleMute() {
    if (!localStream) return;
    muted = !muted;
    localStream.getAudioTracks().forEach(t => t.enabled = !muted);
    document.getElementById("btn-mute").textContent = muted ? "Unmute" : "Mute";
  }

  function toggleVideo() {
    if (!localStream) return;
    videoOff = !videoOff;
    localStream.getVideoTracks().forEach(t => t.enabled = !videoOff);
    document.getElementById("btn-video").textContent = videoOff ? "Show Camera" : "Hide Camera";
  }

  function endCall() {
    socket.emit("call_ended", { partner: PARTNER });
    cleanup();
    window.location.href = "/chat/" + PARTNER;
  }

  function cleanup() {
    if (pc)          { pc.close(); pc = null; }
    if (localStream) { localStream.getTracks().forEach(t => t.stop()); }
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  // Start on load
  init();

  // Cleanup if user closes tab
  window.addEventListener("beforeunload", () => {
    socket.emit("call_ended", { partner: PARTNER });
    cleanup();
  });
</script>
{% endblock %}
