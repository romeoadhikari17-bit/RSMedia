{% extends "base.html" %}
{% block title %}Register — RSMedia{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1>Create Account</h1>
    <p class="subtitle">Join RSMedia today</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               placeholder="Choose a username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               placeholder="Choose a password" required />
      </div>
      <button type="submit" class="btn btn-success" style="width:100%; margin-top:8px;">
        Register
      </button>
    </form>

    <div class="divider"></div>
    <p style="text-align:center; color:var(--fg2); font-size:.9rem;">
      Already have an account?
      <a href="{{ url_for('login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
